<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proc ehf.</title>
  <meta name="description" content="Proc ehf. is a software consultancy in Iceland.">
  <meta name="theme-color" content="#861F2E">
  <meta property="og:title" content="Proc ehf.">
  <meta property="og:description" content="A software consultancy in Iceland.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23861F2E'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='ui-monospace, Menlo, Consolas, monospace' font-size='20' fill='%23F6EDE9'%3E{}%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Schibsted+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <script src="glitch.js" defer></script>
  <style>
    :root {
      --ruby: #861F2E;
      --ink: #F6EDE9;
      --muted: #E3B3BA;
      --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
      --mono: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; }

    html { background: var(--ruby); }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: clamp(1.5rem, 5vw, 4rem);
      background: var(--ruby);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1.125rem;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--ink); color: var(--ruby); }

    h1 {
      font-size: clamp(4.5rem, 17vw, 13rem);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.045em;
      margin-left: -0.04em;
      position: relative;
      width: fit-content;
    }

    h1.glitch-on,
    h1.glitch-on span {
      color: transparent;
    }

    h1 .glitch {
      position: absolute;
      pointer-events: none;
    }

    h1 span {
      display: inline-block;
      margin-left: 0.15em;
      font-size: clamp(1.125rem, 2vw, 1.5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      color: var(--muted);
    }

    main {
      margin-top: auto;
      padding-top: 4rem;
    }

    main p {
      max-width: 34ch;
      font-size: clamp(1.25rem, 2.4vw, 1.75rem);
      line-height: 1.3;
      letter-spacing: -0.01em;
      text-wrap: pretty;
    }

    .call {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.75em;
      margin-top: 2.5rem;
      color: var(--ink);
      font-size: clamp(1.125rem, 2vw, 1.375rem);
      text-decoration: none;
    }

    .call code {
      font-family: var(--mono);
      font-size: 0.95em;
    }

    .call span {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent);
      text-underline-offset: 0.2em;
    }

    .call:hover span,
    .call:focus-visible span {
      color: var(--ink);
      text-decoration-color: var(--ink);
    }

    .call:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .call span { transition: color 150ms ease, text-decoration-color 150ms ease; }
    }
  </style>
</head>
<body>
  <header>
    <h1 aria-label="Proc ehf.">Proc<span>ehf.</span></h1>
  </header>

  <main>
    <p>A software consultancy in Iceland.</p>
    <a class="call" href="mailto:erlingur@proc.is"><code>.call</code><span>erlingur@proc.is</span></a>
  </main>
</body>
</html>
